
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Game Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #233b66;
        }

        #games {
            max-width: 800px;
            margin: 30px auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .game-card h2 {
            margin-top: 0;
        }

        input {
            width: 65px;
            padding: 8px;
            margin-right: 10px;
        }

        button {
            background: #3268c9;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
        }

        button:hover {
            background: #204e9d;
        }

        .message {
            min-height: 20px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>🎮 Game Store</h1>

    <main id="games"></main>

    <script>
        // 获取所有游戏
        async function loadGames() {
            const container = document.getElementById("games");

            try {
                const response = await fetch("/games");

                if (!response.ok) {
                    throw new Error("Failed to load games");
                }

                const games = await response.json();

                container.innerHTML = "";

                games.forEach(game => {
                    const card = document.createElement("div");
                    card.className = "game-card";

                    const title = document.createElement("h2");
                    title.textContent = game.name;

                    const price = document.createElement("p");
                    price.textContent = `Price: $${game.price}`;

                    const stock = document.createElement("p");
                    stock.textContent = `Stock: ${game.stock}`;

                    const quantity = document.createElement("input");
                    quantity.type = "number";
                    quantity.min = "1";
                    quantity.max = "5";
                    quantity.value = "1";
                    quantity.setAttribute(
                        "aria-label",
                        `Quantity for ${game.name}`
                    );

                    const button = document.createElement("button");
                    button.textContent = "Add to Cart";

                    const message = document.createElement("p");
                    message.className = "message";
                    message.setAttribute("role", "status");

                    button.addEventListener("click", async () => {
                        try {
                            const response = await fetch("/cart", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    game_id: game.id,
                                    quantity: Number(quantity.value)
                                })
                            });

                            const result = await response.json();

                            
if (response.ok) {
    message.textContent = "Added to cart!";
    message.style.color = "green";
} else {
    if (Array.isArray(result.detail)) {
        message.textContent = result.detail
            .map(error => error.msg)
            .join("; ");
    } else {
        message.textContent =
            result.detail || "Failed to add";
    }

    message.style.color = "red";
}

                        } catch (error) {
                            message.textContent = "Network error";
                            message.style.color = "red";
                        }
                    });

                    card.append(
                        title, price, stock,
                        quantity, button, message
                    );

                    container.appendChild(card);
                });

            } catch (error) {
                container.textContent = "Failed to load games";
            }
        }

        loadGames();
    </script>
</body>
</html>
